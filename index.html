<style>
:root{
  --sea:#1B7FAE;--sea-deep:#0F5C80;--sea-tint:#E3F3FA;
  --gold:#C9A24B;--gold-soft:#F6EBCB;--gold-ink:#7A5B12;
  --bg:#F4FAFC;--card:#FFFFFF;--fg:#12303F;--fg-2:#4D6877;--line:#B9D9E8;--pat:#1B7FAE;
  --err:#9A3B2E;--err-bg:#FBEDEA;--ok:#1F6B4F;--ok-bg:#E6F4EE;
  --r:1.25rem;--b:0.125rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#5CB9E0;--sea-deep:#8AD0EE;--sea-tint:#16303D;
  --gold:#D8B45C;--gold-soft:#2E2812;--gold-ink:#E6C877;
  --bg:#0C1A22;--card:#132630;--fg:#E8F3F8;--fg-2:#9DB7C4;--line:#2B4A5A;--pat:#5CB9E0;
  --err:#F0A99C;--err-bg:#3A1F1B;--ok:#8FD3B4;--ok-bg:#15322A;}}
:root[data-theme="dark"]{
  --sea:#5CB9E0;--sea-deep:#8AD0EE;--sea-tint:#16303D;
  --gold:#D8B45C;--gold-soft:#2E2812;--gold-ink:#E6C877;
  --bg:#0C1A22;--card:#132630;--fg:#E8F3F8;--fg-2:#9DB7C4;--line:#2B4A5A;--pat:#5CB9E0;
  --err:#F0A99C;--err-bg:#3A1F1B;--ok:#8FD3B4;--ok-bg:#15322A;}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;font-size:1rem;line-height:1.7;min-height:100vh;position:relative;overflow-x:hidden}
.pat{position:fixed;inset:0;width:100%;height:100%;color:var(--pat);opacity:.07;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:30rem;margin:0 auto;padding:1.25rem 1rem 2.5rem}
.top{display:flex;align-items:center;justify-content:space-between;padding:.25rem 0 1rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.6rem;color:var(--sea-deep)}
.brand svg{width:2.2rem;height:2.2rem}
.icon-btn{width:2.75rem;height:2.75rem;border-radius:50%;border:var(--b) solid var(--line);background:var(--card);color:var(--sea-deep);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:1.3rem;height:1.3rem}
.hero{padding:.25rem 0 1.1rem}
.hero h1{font-size:1.5rem;font-weight:800;line-height:1.5}
.hero p{color:var(--fg-2);margin-top:.25rem}
.card{background:var(--card);border:var(--b) solid var(--line);border-radius:var(--r);padding:1.1rem}
.card + .card{margin-top:1rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;background:var(--sea-tint);border-radius:var(--r);padding:.3rem;margin-bottom:1rem}
.tab{min-height:2.75rem;border:0;border-radius:calc(var(--r) - .3rem);background:transparent;color:var(--fg-2);font:inherit;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--sea-deep);box-shadow:0 0 0 var(--b) var(--gold)}
.field{margin-bottom:.9rem}
.field label{display:block;font-weight:600;margin-bottom:.3rem}
.inwrap{position:relative}
input{width:100%;min-height:3rem;border:var(--b) solid var(--line);border-radius:1rem;background:var(--bg);color:var(--fg);font:inherit;padding:.5rem .9rem}
input.ltr{direction:ltr;text-align:right}
input:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 .2rem var(--sea-tint)}
.show{position:absolute;inset-block:.35rem;right:.4rem;border:0;background:var(--sea-tint);color:var(--sea-deep);border-radius:.8rem;padding:0 .8rem;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.inwrap input.has-show{padding-right:4.8rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:3rem;border-radius:1rem;border:var(--b) solid var(--sea);background:var(--sea);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
:root[data-theme="dark"] .btn.p{color:#06202C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#06202C}}
.btn.g{background:var(--card);color:var(--fg);border-color:var(--gold)}
.btn.s{background:transparent;color:var(--sea-deep);border-color:var(--line)}
.btn[disabled]{opacity:.6;cursor:default}
.btn svg{width:1.3rem;height:1.3rem}
.or{display:flex;align-items:center;gap:.7rem;color:var(--fg-2);font-size:.9rem;margin:1rem 0}
.or::before,.or::after{content:"";flex:1;border-top:var(--b) solid var(--line)}
.msg{border-radius:1rem;padding:.65rem .9rem;margin-bottom:.9rem;font-size:.95rem;border:var(--b) solid transparent}
.msg.err{background:var(--err-bg);color:var(--err);border-color:var(--err)}
.msg.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.guest{display:block;text-align:center;margin-top:1.1rem;color:var(--sea-deep);font-weight:700;padding:.6rem}
.note{text-align:center;color:var(--gold-ink);background:var(--gold-soft);border:var(--b) solid var(--gold);border-radius:var(--r);padding:.7rem 1rem;margin-top:1rem;font-weight:600;transition:opacity .4s}
:focus-visible{outline:.2rem solid var(--gold);outline-offset:.15rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.chip{display:inline-flex;align-items:center;gap:.4rem;border-radius:2rem;padding:.2rem .8rem;background:var(--gold-soft);border:var(--b) solid var(--gold);color:var(--gold-ink);font-size:.9rem;font-weight:600}
.chip svg{width:1.1rem;height:1.1rem}
.spin{width:1.2rem;height:1.2rem;border-radius:50%;border:.2rem solid currentColor;border-top-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.note{transition:none}}
</style>
</head>
<body>
<!-- نقشة هندسية خفيفة: مربعات لوح الشوكولاتة وأشكال ورق تغليف الحلوى -->
<svg class="pat" aria-hidden="true" focusable="false"><defs>
  <pattern id="pt" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="scale(9)" x="0" y="0">
    <g fill="none" stroke="currentColor" stroke-width="0.18">
      <rect x="0.8" y="0.8" width="2.6" height="2.6" rx="0.4"/><rect x="3.6" y="0.8" width="2.6" height="2.6" rx="0.4"/>
      <rect x="0.8" y="3.6" width="2.6" height="2.6" rx="0.4"/><rect x="3.6" y="3.6" width="2.6" height="2.6" rx="0.4"/>
      <path d="M6.9 6.9l.9-.5v1l-.9-.5zm1.6 0l-.9-.5v1l.9-.5z"/><circle cx="7.7" cy="6.9" r="0.55"/>
    </g></pattern></defs><rect width="100%" height="100%" fill="url(#pt)" transform="scale(1)"/></svg>

<div class="wrap" id="app"></div>

<script>
(function(){
'use strict';
/* ===== إعداد الاتصال بـ Supabase: ضع رابط مشروعك والمفتاح العام (anon/publishable) هنا ===== */
var BASE='https://pexmuiwuezkxvctjcehs.supabase.co';          /* مثال: https://abcd1234.supabase.co */
var KEY='sb_publishable_wwT5xK_RfzYb2AvcSSmrmA_OPFlBD5h';           /* المفتاح العام فقط، وليس مفتاح service_role أبدًا */
var SKEY='candy_session';

var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
/* الأرقام العربية الشرقية في كل ما يُعرض للمستخدم */
function arNum(n){return String(n).replace(/[0-9]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];});}
function westernDigits(s){return String(s||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);});}
function cleanEmail(v){return westernDigits(v).replace(/[\s​-‏‪-‮]/g,'').toLowerCase();}

var ICON={
  candy:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="9"/><path d="M15.5 19L6 13v22l9.5-6M32.5 19L42 13v22l-9.5-6"/><path d="M20 21c2-2 6-2 8 0"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8.5 8.5 0 1020 14.5z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  google:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h6.2a5.3 5.3 0 01-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.4z"/><path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3A12 12 0 0012 24z"/><path fill="#FBBC05" d="M5.6 14.7a7.2 7.2 0 010-4.6v-3H1.8a12 12 0 000 10.6l3.8-3z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3A12 12 0 001.8 7.1l3.8 3C6.5 6.8 9 4.8 12 4.8z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>'
};

/* ===== المظهر ===== */
function isDark(){var t=document.documentElement.getAttribute('data-theme');if(t)return t==='dark';return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;}
function toggleTheme(){var n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('candy_theme',n);}catch(e){}
  var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',n==='dark'?'#0C1A22':'#1B7FAE');paintTheme();}
function paintTheme(){var b=$('themeBtn');if(b){b.innerHTML=isDark()?ICON.sun:ICON.moon;b.setAttribute('aria-label',isDark()?'الوضع الفاتح':'الوضع الداكن');}}

/* ===== الجلسة ===== */
var session=readStored();
function readStored(){try{var s=JSON.parse(localStorage.getItem(SKEY)||'null');return s&&s.access_token?s:null;}catch(e){return null;}}
function saveSession(s){session=s;try{if(s)localStorage.setItem(SKEY,JSON.stringify(s));else localStorage.removeItem(SKEY);}catch(e){}}
function userInfo(){var u=session&&session.user,m=(u&&u.user_metadata)||{};return{email:(u&&u.email)||'',name:m.name||m.full_name||''};}
function configured(){return /^https?:\/\//.test(BASE)&&KEY.indexOf('ضع_')<0;}

async function auth(path,body,method){
  var res=await fetch(BASE+path,{method:method||'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  var txt=await res.text(),j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!res.ok){var er=new Error((j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+res.status));er.status=res.status;er.code=j&&(j.error_code||j.code);throw er;}
  return j;
}
function toSession(j){return{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||(Math.floor(Date.now()/1000)+(j.expires_in||3600)),user:j.user};}

/* رسائل هادئة بدون لوم */
function friendly(e,mode){
  var m=(e&&e.message||'')+' '+(e&&e.code||'');
  if(/already registered|user_already_exists|already been registered/i.test(m))return 'هذا البريد مسجّل لدينا، يمكنك الدخول من تبويب «تسجيل الدخول».';
  if(/invalid login|invalid_credentials/i.test(m))return 'لم نجد حسابًا بهذه البيانات، راجع البريد وكلمة المرور وحاول مرة أخرى.';
  if(/not confirmed|email_not_confirmed/i.test(m))return 'فعّل بريدك من الرسالة التي أرسلناها إليك، ثم ادخل.';
  if(/password.*(short|least|weak)|weak_password/i.test(m))return 'كلمة المرور قصيرة، اكتب ٦ أحرف على الأقل.';
  if(/rate limit|over_.*rate|too many/i.test(m)||e.status===429)return 'محاولات كثيرة في وقت قصير، انتظر دقيقة ثم أعد المحاولة.';
  if(/signups? (not allowed|disabled)|signup_disabled/i.test(m))return 'التسجيل غير متاح الآن، حاول لاحقًا.';
  if(e&&e.name==='TypeError')return 'تعذّر الاتصال بالإنترنت، تأكد من الشبكة وحاول مرة أخرى.';
  return mode==='up'?'تعذّر إنشاء الحساب الآن، حاول مرة أخرى بعد قليل.':'تعذّر الدخول الآن، حاول مرة أخرى بعد قليل.';
}

/* ===== التوجيه ===== */
var tab='up',guest=false;
function route(){return location.hash.replace(/^#\/?/,'')||'';}
function render(){
  var r=route();
  if(r==='home'){if(session||guest){home();return;}location.hash='#/';return;}
  if(session){location.hash='#/home';return;}
  login();
}
window.addEventListener('hashchange',render);

function topbar(){return '<div class="top"><div class="brand">'+ICON.candy+'<span>كاندي</span></div><button class="icon-btn" id="themeBtn" type="button"></button></div>';}

/* ===== الشاشة الأولى: الدخول ===== */
function login(){
  var up=tab==='up';
  $('app').innerHTML=topbar()+
  '<div class="hero"><h1>أهلًا بك في كاندي</h1><p>شوكولاتة وسناكس تسعد يومك، أنشئ حسابك في ثوانٍ.</p></div>'+
  '<div class="card">'+
    '<div class="tabs" role="tablist"><button class="tab" role="tab" id="tUp" aria-selected="'+up+'" type="button">حساب جديد</button><button class="tab" role="tab" id="tIn" aria-selected="'+(!up)+'" type="button">تسجيل الدخول</button></div>'+
    '<div id="msg" role="status" aria-live="polite"></div>'+
    '<form id="f" novalidate>'+
      (up?'<div class="field"><label for="nm">الاسم</label><input id="nm" autocomplete="name" type="text" placeholder="اسمك"></div>':'')+
      '<div class="field"><label for="em">البريد الإلكتروني</label><input id="em" class="ltr" dir="ltr" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="name@example.com"></div>'+
      '<div class="field"><label for="pw">كلمة المرور'+(up?' (٦ أحرف على الأقل)':'')+'</label><div class="inwrap"><input id="pw" class="ltr has-show" dir="ltr" type="password" autocomplete="'+(up?'new-password':'current-password')+'" autocapitalize="off"><button class="show" id="sh" type="button" aria-label="إظهار كلمة المرور">إظهار</button></div></div>'+
      '<button class="btn p" id="go" type="submit">'+(up?'إنشاء الحساب':'دخول')+'</button>'+
    '</form>'+
    '<div class="or"><span>أو</span></div>'+
    '<button class="btn g" id="gg" type="button">'+ICON.google+'المتابعة عبر جوجل</button>'+
  '</div>'+
  '<a class="guest" id="gs" href="#/home">تصفّح الموقع بدون تسجيل الدخول</a>'+
  '<div class="note" id="note"></div>';
  paintTheme();rotate();
  $('themeBtn').onclick=toggleTheme;
  $('tUp').onclick=function(){tab='up';login();};
  $('tIn').onclick=function(){tab='in';login();};
  $('sh').onclick=function(){var p=$('pw'),s=p.type==='password';p.type=s?'text':'password';this.textContent=s?'إخفاء':'إظهار';};
  $('gs').onclick=function(){guest=true;};
  $('gg').onclick=startGoogle;
  $('f').addEventListener('submit',submit);
}
function setMsg(t,kind){$('msg').innerHTML=t?'<div class="msg '+kind+'">'+esc(t)+'</div>':'';}
async function submit(e){
  e.preventDefault();
  var up=tab==='up',nm=up?$('nm').value.trim().replace(/\s+/g,' '):'',em=cleanEmail($('em').value),pw=$('pw').value;
  $('em').value=em;
  if(up&&!nm)return setMsg('اكتب اسمك أولًا.','err');
  if(!/^\S+@\S+\.\S+$/.test(em))return setMsg('اكتب بريدًا إلكترونيًا صحيحًا.','err');
  if(up&&pw.length<6)return setMsg('كلمة المرور قصيرة، اكتب ٦ أحرف على الأقل.','err');
  if(!up&&!pw)return setMsg('اكتب كلمة المرور.','err');
  if(!configured())return setMsg('الموقع قيد التجهيز، سنفتح لك التسجيل قريبًا.','err');
  var b=$('go'),old=b.textContent;b.disabled=true;b.innerHTML='<span class="spin"></span>';setMsg('');
  try{
    if(up){
      var j=await auth('/auth/v1/signup',{email:em,password:pw,data:{name:nm}});
      if(j&&j.access_token){saveSession(toSession(j));location.hash='#/home';render();return;}
      /* لو التأكيد بالبريد مفعّل في Supabase لا تأتي جلسة */
      b.disabled=false;b.textContent=old;
      if(j&&j.user&&Array.isArray(j.user.identities)&&!j.user.identities.length)return setMsg('هذا البريد مسجّل لدينا، يمكنك الدخول من تبويب «تسجيل الدخول».','err');
      return setMsg('أرسلنا رابط التفعيل إلى بريدك، افتحه ثم ارجع وادخل.','ok');
    }
    var s=await auth('/auth/v1/token?grant_type=password',{email:em,password:pw});
    saveSession(toSession(s));location.hash='#/home';render();
  }catch(er){b.disabled=false;b.textContent=old;setMsg(friendly(er,up?'up':'in'),'err');}
}

/* ===== جوجل ===== */
function startGoogle(){
  if(!configured())return setMsg('الموقع قيد التجهيز، سنفتح لك الدخول بجوجل قريبًا.','err');
  location.href=BASE+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin+location.pathname);
}
async function oauthFinish(){
  var h=location.hash||'';
  if(h.indexOf('access_token=')<0&&h.indexOf('error_description=')<0)return false;
  var q=h.slice(h.search(/access_token=|error_description=|error=/));
  var p=new URLSearchParams(q);
  history.replaceState(null,'',location.pathname+location.search+'#/');
  if(!p.get('access_token')){render();setMsg('تعذّر الدخول بجوجل، جرّب مرة أخرى.','err');return true;}
  try{
    var res=await fetch(BASE+'/auth/v1/user',{headers:{'apikey':KEY,'Authorization':'Bearer '+p.get('access_token')}});
    if(!res.ok)throw new Error('user');
    var user=await res.json();
    saveSession({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:+p.get('expires_at')||(Math.floor(Date.now()/1000)+(+p.get('expires_in')||3600)),user:user});
    location.hash='#/home';render();
  }catch(e){render();setMsg('تعذّر الدخول بجوجل، جرّب مرة أخرى.','err');}
  return true;
}

/* ===== الرئيسية (مؤقتة حتى نبني بقية الشاشات) ===== */
function home(){
  var m=userInfo();
  $('app').innerHTML=topbar()+
  '<div class="hero"><h1>'+(session?('أهلًا بك'+(m.name?' يا '+esc(m.name):'')):'أهلًا بك في كاندي')+'</h1><p>ادخل على كاندي الآن، ستجد ما يسرّك.</p></div>'+
  '<div class="card"><div class="chips"><span class="chip">'+ICON.star+'شوكولاتة</span><span class="chip">'+ICON.star+'سناكس</span></div><p>نجهّز لك صفحات المنتجات، وستظهر هنا قريبًا بإذن الله.</p></div>'+
  (session?'<div class="card"><p style="color:var(--fg-2)" dir="ltr">'+esc(m.email)+'</p><button class="btn s" id="out" type="button" style="margin-top:.7rem">تسجيل الخروج</button></div>'
          :'<div class="card"><p>أنت تتصفح كضيف. أنشئ حسابًا ليسهل عليك طلب ما تحب لاحقًا.</p><a class="btn p" id="mk" href="#/" style="margin-top:.7rem">إنشاء حساب</a></div>')+
  '<div class="note" id="note"></div>';
  paintTheme();rotate();
  $('themeBtn').onclick=toggleTheme;
  if($('out'))$('out').onclick=function(){saveSession(null);guest=false;tab='in';location.hash='#/';render();};
  if($('mk'))$('mk').onclick=function(){guest=false;tab='up';};
}

/* رسائل تشجيعية هادئة تظهر داخل الموقع كل فترة */
var MSG=['ادخل على كاندي الآن، ستجد ما يسرّك','شوكولاتة وسناكس تسعد يومك','اختر ما يناسبك، ونحن نجهّزه لك','يسعدنا أن نخدمك اليوم'],mi=0,rt=null;
function rotate(){var n=$('note');if(!n)return;mi=0;n.textContent=MSG[0];clearInterval(rt);rt=setInterval(function(){var x=$('note');if(!x){clearInterval(rt);return;}mi=(mi+1)%MSG.length;x.style.opacity=0;setTimeout(function(){x.textContent=MSG[mi];x.style.opacity=1;},350);},9000);}

/* ===== البدء ===== */
if(!location.hash)history.replaceState(null,'',location.pathname+location.search+'#/');
oauthFinish().then(function(done){if(!done)render();});
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);}catch(e){}
})();
</script>
</body>
</html>
