/* ===== البحث التقريبي بالعربية ===== */
function norm(s){
  s=westernDigits(String(s||'')).toLowerCase();
  s=s.replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-يa-z0-9\s]/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function stem(w){return w.length>3&&w.indexOf('ال')===0?w.slice(2):w;}
function words(s){return norm(s).split(' ').filter(function(w){return w&&w!=='ال';}).map(stem);}
function lev(a,b,max){
  var la=a.length,lb=b.length;if(Math.abs(la-lb)>max)return max+1;
  var prev=[],cur=[],i,j;for(j=0;j<=lb;j++)prev[j]=j;
  for(i=1;i<=la;i++){cur[0]=i;var mn=cur[0];
    for(j=1;j<=lb;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));if(cur[j]<mn)mn=cur[j];}
    if(mn>max)return max+1;prev=cur;cur=[];}
  return prev[lb];
}
function isSubseq(q,w){var i=0;for(var j=0;j<w.length&&i<q.length;j++)if(w.charAt(j)===q.charAt(i))i++;return i===q.length;}
/* أعلى درجة لكلمة بحث q مقابل كلمة من المنتج w */
function wordScore(q,w,strict){
  if(w===q)return 100;
  if(w.indexOf(q)===0)return 92-Math.min(10,w.length-q.length);   /* يبدأ بها (الحرف الأول مثلًا) */
  var at=w.indexOf(q);
  if(at>0)return at+q.length===w.length?66:60;                      /* في الوسط أو في النهاية */
  if(q.length>=3&&!strict){
    var d=lev(q,w,q.length>=6?2:1);if(d<=(q.length>=6?2:1))return 52-d*8;     /* خطأ إملائي بسيط */
    var d2=lev(q,w.slice(0,q.length),q.length>=5?1:0);if(d2<=(q.length>=5?1:0)&&q.length>=4)return 44-d2*6;
    if(isSubseq(q,w))return 28;                                      /* حروف متفرقة بنفس الترتيب */
  }
  return 0;
}
function searchProducts(query){
  var qs=words(query);if(!qs.length)return [];
  var cn={};(DB.cats||[]).forEach(function(c){cn[c.id]=words(c.name);});
  var out=[];
  (DB.prods||[]).forEach(function(p){
    var nw=words(p.name),cw=cn[p.category_id]||[],fw=words(p.features||''),tot=0,ok=true;
    for(var i=0;i<qs.length;i++){
      var best=0,k;
      for(k=0;k<nw.length;k++)best=Math.max(best,wordScore(qs[i],nw[k]));
      if(qs[i].length>=3){for(k=0;k<cw.length;k++)best=Math.max(best,wordScore(qs[i],cw[k],true)*0.6);
        for(k=0;k<fw.length;k++)best=Math.max(best,wordScore(qs[i],fw[k],true)*0.3);}
      if(best<=0){ok=false;break;}tot+=best;
    }
    if(!ok)return;
    if(norm(p.name).indexOf(norm(query))===0)tot+=20;
    out.push({p:p,s:tot});
  });
  out.sort(function(a,b){return b.s-a.s||a.p.name.localeCompare(b.p.name,'ar');});
  return out.slice(0,40).map(function(x){return x.p;});
}

function setMsg(t,kind){$('msg').innerHTML=t?'<div class="msg '+kind+'">'+esc(t)+'</div>':'';}
async function submit(e){
  e.preventDefault();
  var up=tab==='up',nm=up?$('nm').value.trim().replace(/\s+/g,' '):'',em=cleanEmail($('em').value),pw=$('pw').value;
  $('em').value=em;
  if(up&&!nm)return setMsg('اكتب اسمك أولًا.','err');
  if(!/^\S+@\S+\.\S+$/.test(em))return setMsg('اكتب بريدًا إلكترونيًا صحيحًا.','err');
  if(up&&pw.length<6)return setMsg('كلمة المرور قصيرة، اكتب ٦ أحرف على الأقل.','err');
  if(!up&&!pw)return setMsg('اكتب كلمة المرور.','err');
  if(!configured())return setMsg('الموقع قيد التجهيز، سنفتح لك التسجيل قريبًا.','err');
  var b=$('go'),old=b.textContent;b.disabled=true;b.innerHTML='<span class="spin"></span>';setMsg('');
  try{
    if(up){
      var j=await auth('/auth/v1/signup',{email:em,password:pw,data:{name:nm}});
      if(j&&j.access_token){saveSession(toSession(j));location.hash='#/home';render();return;}
      /* لو التأكيد بالبريد مفعّل في Supabase لا تأتي جلسة */
      b.disabled=false;b.textContent=old;
      if(j&&j.user&&Array.isArray(j.user.identities)&&!j.user.identities.length)return setMsg('هذا البريد مسجّل لدينا، يمكنك الدخول من تبويب «تسجيل الدخول».','err');
      return setMsg('أرسلنا رابط التفعيل إلى بريدك، افتحه ثم ارجع وادخل.','ok');
    }
    var s=await auth('/auth/v1/token?grant_type=password',{email:em,password:pw});
    saveSession(toSession(s));location.hash='#/home';render();
  }catch(er){b.disabled=false;b.textContent=old;setMsg(friendly(er,up?'up':'in'),'err');}
}

/* ===== جوجل ===== */
function startGoogle(){
  if(!configured())return setMsg('الموقع قيد التجهيز، سنفتح لك الدخول بجوجل قريبًا.','err');
  location.href=BASE+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin+location.pathname);
}
async function oauthFinish(){
  var h=location.hash||'';
  if(h.indexOf('access_token=')<0&&h.indexOf('error_description=')<0)return false;
  var q=h.slice(h.search(/access_token=|error_description=|error=/));
  var p=new URLSearchParams(q);
  history.replaceState(null,'',location.pathname+location.search+'#/');
  if(!p.get('access_token')){render();setMsg('تعذّر الدخول بجوجل، جرّب مرة أخرى.','err');return true;}
  try{
    var res=await fetch(BASE+'/auth/v1/user',{headers:{'apikey':KEY,'Authorization':'Bearer '+p.get('access_token')}});
    if(!res.ok)throw new Error('user');
    var user=await res.json();
    saveSession({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:+p.get('expires_at')||(Math.floor(Date.now()/1000)+(+p.get('expires_in')||3600)),user:user});
    location.hash='#/home';render();
  }catch(e){render();setMsg('تعذّر الدخول بجوجل، جرّب مرة أخرى.','err');}
  return true;
}

  var a=false;if(session){shell('<div class="skel"></div>','me');a=await checkAdmin();if(my!==RT)return;}
  var m=userInfo(),l=getLoc(),h='<h1 class="ct">حسابي</h1>';
  if(!session){
    shell(h+'<div class="card"><p>أنت تتصفح كضيف. أنشئ حسابًا لتتمكن من إرسال طلباتك.</p><a class="btn p" href="#/" style="margin-top:.7rem">تسجيل الدخول أو حساب جديد</a></div>','me');return;
  }
  shell(h+'<div class="card"><h2>'+esc(m.name||'عميل كاندي')+'</h2><p dir="ltr" style="text-align:right;color:var(--fg-2)">'+esc(m.email)+'</p>'+(a?'<div class="chips"><span class="chip">'+ICON.star+'مالك المتجر</span></div>':'')+'</div>'+
    '<div class="card"><div class="locrow"><span>'+ICON.pin+(l?'موقعك محفوظ':'لم يُحدَّد موقعك')+'</span><button class="btn s" data-act="locate" type="button">'+(l?'تحديث الموقع':'حدّد موقعي')+'</button></div></div>'+
    '<div class="card"><button class="btn s" id="out" data-act="logout" type="button">تسجيل الخروج</button></div>','me');
}

/* ===== الطلبات (للمالك) ===== */
var ST={new:'جديد',preparing:'قيد التحضير',done:'تم التسليم',cancelled:'ملغي'};
async function screenOrders(my){
  shell('<h1 class="ct">الطلبات</h1><div class="skel"></div>','orders');
  var a=await checkAdmin();if(my!==RT)return;
  if(!a){$('app').innerHTML='<h1 class="ct">الطلبات</h1><div class="empty"><p>هذه الشاشة لمالك المتجر فقط.</p></div>';return;}
  var rows;try{rows=await rest('/rest/v1/orders?select=*&order=created_at.desc&limit=60');}catch(e){if(my===RT)$('app').innerHTML='<h1 class="ct">الطلبات</h1>'+failBox();return;}
  if(my!==RT)return;
  var h='<h1 class="ct">الطلبات</h1>';
  if(!rows.length)h+='<div class="empty"><p>لا توجد طلبات بعد.</p></div>';
  rows.forEach(function(o){
    var w=waNum(o.customer_phone),t=telHref(o.customer_phone),map=(o.lat!=null&&o.lng!=null)?'https://maps.google.com/?q='+o.lat+','+o.lng:'';
    h+='<section class="card ord"><div class="oh"><b>'+esc(o.customer_name||'عميل')+'</b><span class="chip">'+esc(ST[o.status]||o.status)+'</span></div><small>'+timeAgo(o.created_at)+'</small>'+
      '<ul class="oi">'+(o.items||[]).map(function(i){return '<li><span>'+esc(i.name)+' × '+arNum(i.qty)+'</span><span>'+fmt(i.price*i.qty)+'</span></li>';}).join('')+'</ul>'+
      (o.note?'<p class="onote">'+esc(o.note)+'</p>':'')+'<div class="total sm"><span>الإجمالي</span><b>'+fmt(o.total)+' جنيه</b></div>'+
      '<div class="adm">'+(t?'<a class="btn s" href="'+esc(t)+'">'+ICON.phone+arNum(o.customer_phone)+'</a>':'')+(w?'<a class="btn s" href="https://wa.me/'+w+'" target="_blank" rel="noopener">'+ICON.wa+'واتساب</a>':'')+(map?'<a class="btn s" href="'+esc(map)+'" target="_blank" rel="noopener">'+ICON.pin+'الموقع</a>':'')+'</div>'+
      '<div class="sts">'+Object.keys(ST).map(function(k){return '<button class="btn '+(o.status===k?'p':'s')+'" data-act="ost" data-id="'+o.id+'" data-st="'+k+'" type="button">'+ST[k]+'</button>';}).join('')+'</div></section>';
  });
  $('app').innerHTML=h;
}

/* ===== نماذج المالك: الأقسام والمنتجات والصور ===== */
function ownerErr(e){
  var m=(e&&e.message||'')+' '+(e&&e.code||'');
  if(/row-level security|42501|permission/i.test(m)||e.status===403)return 'هذه العملية لمالك المتجر فقط.';
  if(e&&e.name==='TypeError')return 'تعذّر الاتصال بالإنترنت، حاول مرة أخرى.';
  if(/check constraint|23514/.test(m))return 'راجع البيانات المكتوبة، فيها قيمة غير مقبولة.';
  return 'تعذّر الحفظ الآن، حاول مرة أخرى.';
}
function compress(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var max=800,s=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement('canvas');
      c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(function(b){
        if(b&&b.size>500000){c.toBlob(function(b2){b2?res(b2):rej(new Error('img'));},'image/jpeg',0.5);}else if(b)res(b);else rej(new Error('img'));
      },'image/jpeg',0.72);
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    im.src=url;
  });
}
function uid(){try{return crypto.randomUUID();}catch(e){return String(Date.now())+Math.random().toString(16).slice(2);}}
async function uploadImg(blob){
  var path='p/'+uid()+'.jpg';
  await rest('/storage/v1/object/products/'+path,{method:'POST',body:blob,headers:{'Content-Type':'image/jpeg','cache-control':'max-age=31536000'}});
  return path;
}
function delImg(p){if(p)rest('/storage/v1/object/products/'+encodeURI(p),{method:'DELETE'}).catch(function(){});}
function imgField(cur){
  return '<div class="field"><label>الصورة'+(cur?'':' (اختيارية)')+'</label><div class="imgpick"><div class="ip" id="ipv">'+(cur?'<img src="'+esc(imgUrl(cur))+'" alt="">':PH)+'</div><label class="btn s" for="ifl">اختر صورة</label><input id="ifl" type="file" accept="image/*" hidden></div></div>';
}
function wirePick(state){
  $('ifl').addEventListener('change',async function(){
    var f=this.files&&this.files[0];if(!f)return;
    try{state.blob=await compress(f);var u=URL.createObjectURL(state.blob);$('ipv').innerHTML='<img src="'+u+'" alt="">';}
    catch(e){toast('تعذّر قراءة هذه الصورة، جرّب صورة أخرى.');}
  });
}
function formErr(t){var e=$('fe');e.textContent=t;e.hidden=!t;}

function catForm(c){
  var st={blob:null};
  openSheet('<h2>'+(c?'تعديل القسم':'إضافة قسم')+'</h2><form id="fm" novalidate><div class="field"><label for="fn">اسم القسم</label><input id="fn" maxlength="60" value="'+esc(c?c.name:'')+'" placeholder="مثال: المشروبات"></div>'+imgField(c&&c.image)+'<p class="msg err" id="fe" hidden></p><button class="btn p" id="fs" type="submit">حفظ</button></form>');
  wirePick(st);
  $('fm').addEventListener('submit',async function(e){
    e.preventDefault();var name=$('fn').value.trim().replace(/\s+/g,' ');if(!name)return formErr('اكتب اسم القسم.');
    var b=$('fs');b.disabled=true;b.innerHTML='<span class="spin"></span>';formErr('');
    try{
      var img=c?c.image:null;if(st.blob)img=await uploadImg(st.blob);
      if(c){await rest('/rest/v1/categories?id=eq.'+c.id,{method:'PATCH',json:{name:name,image:img},prefer:'return=minimal'});if(st.blob&&c.image)delImg(c.image);}
      else await rest('/rest/v1/categories',{method:'POST',json:{name:name,image:img,sort:(DB.cats||[]).length},prefer:'return=minimal'});
      dropData();await loadData(true);closeSheet();toast('تم الحفظ');paintHome();
    }catch(er){b.disabled=false;b.textContent='حفظ';formErr(ownerErr(er));}
  });
}
function prodForm(p,catId){
  var st={blob:null};
  openSheet('<h2>'+(p?'تعديل المنتج':'إضافة منتج')+'</h2><form id="fm" novalidate>'+imgField(p&&p.image)+
    '<div class="field"><label for="fn">اسم المنتج</label><input id="fn" maxlength="80" value="'+esc(p?p.name:'')+'" placeholder="مثال: ردبل"></div>'+
    '<div class="field"><label for="fp">السعر بالجنيه</label><input id="fp" class="ltr" dir="ltr" inputmode="decimal" value="'+(p?esc(String(Number(p.price))):'')+'" placeholder="60"></div>'+
    '<div class="field"><label for="ff">المميزات</label><input id="ff" maxlength="300" value="'+esc(p?p.features||'':'')+'" placeholder="مثال: يمنحك جرعة كبيرة من الطاقة"></div>'+
    '<div class="field"><label for="fw">رقم الواتساب</label><input id="fw" class="ltr" dir="ltr" inputmode="tel" value="'+esc(p?p.whatsapp||'':'')+'" placeholder="01XXXXXXXXX"></div>'+
    '<div class="field"><label for="fc">رقم الاتصال</label><input id="fc" class="ltr" dir="ltr" inputmode="tel" value="'+esc(p?p.phone||'':'')+'" placeholder="01XXXXXXXXX"></div>'+
    '<label class="chk"><input id="fa" type="checkbox"'+(!p||p.available?' checked':'')+'><span>متاح للطلب الآن</span></label>'+
    '<p class="msg err" id="fe" hidden></p><button class="btn p" id="fs" type="submit">حفظ</button></form>');
  wirePick(st);
  $('fm').addEventListener('submit',async function(e){
    e.preventDefault();
    var name=$('fn').value.trim().replace(/\s+/g,' '),price=parseFloat(westernDigits($('fp').value).replace('٫','.').replace(/[^\d.]/g,''));
    if(!name)return formErr('اكتب اسم المنتج.');
    if(!isFinite(price)||price<0||price>100000)return formErr('اكتب السعر بالأرقام، مثل: ٦٠');
    var body={name:name,price:price,features:$('ff').value.trim()||null,whatsapp:cleanPhone($('fw').value)||null,phone:cleanPhone($('fc').value)||null,available:$('fa').checked};
    var b=$('fs');b.disabled=true;b.innerHTML='<span class="spin"></span>';formErr('');
    try{
      if(st.blob)body.image=await uploadImg(st.blob);
      if(p){await rest('/rest/v1/products?id=eq.'+p.id,{method:'PATCH',json:body,prefer:'return=minimal'});if(st.blob&&p.image)delImg(p.image);}
      else{body.category_id=catId;await rest('/rest/v1/products',{method:'POST',json:body,prefer:'return=minimal'});}
      dropData();await loadData(true);closeSheet();toast('تم الحفظ');render();
    }catch(er){b.disabled=false;b.textContent='حفظ';formErr(ownerErr(er));}
  });
}

/* ===== الأحداث ===== */
function logout(){saveSession(null);ADMIN=null;setGuest(false);tab='in';location.hash='#/';render();}
document.addEventListener('click',async function(ev){
  var el=ev.target.closest&&ev.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(a==='retry'){dropData();render();return;}
  if(a==='add'){setQty(id,1);refreshCtl(id);return;}
  if(a==='inc'){setQty(id,qtyOf(id)+1);refreshCtl(id);return;}
  if(a==='dec'){setQty(id,qtyOf(id)-1);refreshCtl(id);return;}
  if(a==='cinc'){setQty(id,qtyOf(id)+1);paintCart();return;}
  if(a==='cdec'){setQty(id,qtyOf(id)-1);paintCart();return;}
  if(a==='crm'){setQty(id,0);paintCart();return;}
  if(a==='locate'){el.disabled=true;var l=await askGeo();toast(l?'تم حفظ موقعك':'لم نتمكن من معرفة موقعك، تأكد من السماح بالموقع في المتصفح');if(route()==='cart')paintCart();else if(route()==='me')render();else el.disabled=false;return;}
  if(a==='send'){sendOrder();return;}
  if(a==='logout'){logout();return;}
  if(!isAdminNow())return;
  if(a==='addcat'){catForm(null);return;}
  if(a==='editcat'){catForm(DB.cats.filter(function(c){return c.id===id;})[0]);return;}
  if(a==='delcat'){
    var c=DB.cats.filter(function(x){return x.id===id;})[0];if(!c)return;
    var n=DB.prods.filter(function(p){return p.category_id===id;}).length;
    if(!await confirmSheet('حذف القسم','سنحذف القسم «'+c.name+'»'+(n?' وكل منتجاته ('+arNum(n)+')':'')+'. لا يمكن التراجع.','نعم، احذف'))return;
    try{
      var imgs=[c.image].concat(DB.prods.filter(function(p){return p.category_id===id;}).map(function(p){return p.image;}));
      await rest('/rest/v1/categories?id=eq.'+id,{method:'DELETE',prefer:'return=minimal'});imgs.forEach(delImg);
      dropData();await loadData(true);toast('تم حذف القسم');paintHome();
    }catch(e){toast(ownerErr(e));}
    return;
  }
  if(a==='addprod'){prodForm(null,id);return;}
  if(a==='editprod'){prodForm(DB.prods.filter(function(p){return p.id===id;})[0],null);return;}
  if(a==='delprod'){
    var p=DB.prods.filter(function(x){return x.id===id;})[0];if(!p)return;
    if(!await confirmSheet('حذف المنتج','سنحذف «'+p.name+'». لا يمكن التراجع.','نعم، احذف'))return;
    try{await rest('/rest/v1/products?id=eq.'+id,{method:'DELETE',prefer:'return=minimal'});delImg(p.image);setQty(id,0);dropData();await loadData(true);toast('تم حذف المنتج');render();}
    catch(e){toast(ownerErr(e));}
    return;
  }
  if(a==='ost'){
    try{await rest('/rest/v1/orders?id=eq.'+id,{method:'PATCH',json:{status:el.getAttribute('data-st')},prefer:'return=minimal'});render();}
    catch(e){toast(ownerErr(e));}
    return;
  }
});

/* ===== البدء ===== */
if(!location.hash)history.replaceState(null,'',location.pathname+location.search+'#/');
oauthFinish().then(function(done){if(!done)render();});
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);}catch(e){}
})();
</script>
